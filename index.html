<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Orang Berjalan — Blender</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #111827, #312e81)
        }

        main {
            width: min(960px, 92vw);
            text-align: center
        }

        h1 {
            margin: 0 0 8px
        }

        p {
            color: #cbd5e1
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            min-height: 420px;
            border-radius: 20px;
            background: radial-gradient(circle at 50% 30%, #cbd5e1 0%, #64748b 62%, #334155 100%);
            border: 3px solid rgba(226,232,240,.9);
            outline: 1px solid rgba(15,23,42,.8);
            outline-offset: 4px;
            box-shadow: 0 24px 70px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.22), inset 0 0 45px rgba(0,0,0,.24)
        }
    </style>
    <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
</head>

<body>
    <main>
        <p>Masih coba-coba haha.</p><model-viewer src="./orang-berjalan.glb?v=14" autoplay
            animation-name="Walk" camera-orbit="0deg 85deg 9m" field-of-view="35deg" camera-controls
            shadow-intensity="1.5" shadow-softness="0.8" exposure="1.35" environment-image="neutral"></model-viewer>
    </main>
</body>

</html>
